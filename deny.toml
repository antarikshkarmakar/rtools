[advisories]
version = 2
yanked = "deny"
# `paste` and `ttf-parser` are only transitive, and RustSec reports no safe
# upgrade path for either advisory.
ignore = ["RUSTSEC-2024-0436", "RUSTSEC-2026-0192"]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
