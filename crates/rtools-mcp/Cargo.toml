[package]
name = "rtools-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "MCP server for rtools"
readme = "../../README.md"
keywords = ["rtools", "mcp", "model-context-protocol"]
categories = ["command-line-utilities"]

[[bin]]
name = "rtools-mcp"
path = "src/main.rs"

[dependencies]
rtools-core = { path = "../rtools-core", version = "0.1.0" }
rtools-image = { path = "../rtools-image", version = "0.1.0" }
rtools-pdf = { path = "../rtools-pdf", version = "0.1.0" }
rtools-ai = { path = "../rtools-ai", version = "0.1.0" }
rmcp = { workspace = true }
# Direct dependency so `#[derive(JsonSchema)]` resolves to `::schemars` in
# generated code and so the `derive` feature is enabled (rmcp only enables
# `chrono04`). Resolves to the same crate/version as rmcp's schemars dep.
schemars = { version = "1", features = ["derive"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
image = { workspace = true }
tempfile = "3.8"

[lints]
workspace = true
