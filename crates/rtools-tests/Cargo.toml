[package]
name = "rtools-tests"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
rtools-core = { path = "../rtools-core", version = "0.1.0" }
rtools-image = { path = "../rtools-image", version = "0.1.0" }
rtools-pdf = { path = "../rtools-pdf", version = "0.1.0" }
rtools-ai = { path = "../rtools-ai", version = "0.1.0" }
image = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "image_tests"
path = "tests/image_tests.rs"

[[test]]
name = "ai_tests"
path = "tests/ai_tests.rs"

# Dependencies are consumed by the integration tests in `tests/`, not by the
# (empty) library target, which is what `unused_crate_dependencies` lints.
# `workspace = true` does not allow per-lint overrides, so repeat the
# workspace lints here with that one lint relaxed.
[lints.rust]
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
unused_crate_dependencies = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "allow"
expect_used = "allow"
missing_docs_in_private_items = "allow"
multiple_crate_versions = "allow"
use_self = "allow"
must_use_candidate = "allow"
