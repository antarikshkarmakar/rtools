[package]
name = "rtools-ai"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AI/ML processing operations for rtools"
readme = "../README.md"

[dependencies]
rtools-core = { path = "../rtools-core" }
serde = { workspace = true }
serde_json = { workspace = true }
