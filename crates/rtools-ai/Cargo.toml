[package]
name = "rtools-ai"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "AI/ML processing operations for rtools"
readme = "../../README.md"
keywords = ["rtools", "ai", "image", "file-processing"]
categories = ["multimedia::images"]

[dependencies]
rtools-core = { path = "../rtools-core", version = "0.1.0" }
serde = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Image processing for AI
image = { workspace = true }
icu_casemap = "=2.3.0"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
