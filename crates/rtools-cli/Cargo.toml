[package]
name = "rtools-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "CLI interface for rtools"
readme = "../README.md"

[[bin]]
name = "rtools"
path = "src/main.rs"

[dependencies]
rtools-core = { path = "../rtools-core" }
rtools-image = { path = "../rtools-image" }
rtools-pdf = { path = "../rtools-pdf" }
rtools-ai = { path = "../rtools-ai" }
clap = { workspace = true }
clap_complete = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
colored = "2.0"

[lints]
workspace = true