[package]
name = "rtools-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "CLI interface for rtools"
readme = "../../README.md"
keywords = ["rtools", "cli", "file-processing"]
categories = ["command-line-utilities"]

[[bin]]
name = "rtools"
path = "src/main.rs"

[dependencies]
rtools-core = { path = "../rtools-core", version = "0.1.0" }
rtools-image = { path = "../rtools-image", version = "0.1.0" }
rtools-pdf = { path = "../rtools-pdf", version = "0.1.0" }
rtools-ai = { path = "../rtools-ai", version = "0.1.0" }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }

[lints]
workspace = true
