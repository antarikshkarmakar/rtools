[package]
name = "rtools-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "REST/gRPC API server for rtools"
readme = "../../README.md"
keywords = ["rtools", "api", "rest", "grpc"]
categories = ["web-programming::http-server"]

[[bin]]
name = "rtools-api"
path = "src/main.rs"

[dependencies]
rtools-core = { path = "../rtools-core", version = "0.1.0" }
rtools-image = { path = "../rtools-image", version = "0.1.0" }
rtools-pdf = { path = "../rtools-pdf", version = "0.1.0" }
rtools-ai = { path = "../rtools-ai", version = "0.1.0" }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = "3.8"

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
